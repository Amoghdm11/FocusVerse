<svg xmlns="http://www.w3.org/2000/svg" viewBox="400 245 256 350" width="256" height="350"><style>.spider-study-room { border:1px solid #795b48; background:#161e2c; box-shadow:0 18px 55px #060b1890; border-radius:10px; overflow:hidden; }
.queens-caption { padding:16px 22px; display:flex; justify-content:space-between; gap:16px; color:#c6b8a6; font:9px monospace; letter-spacing:2px; background:#17202c; }
.queens-caption span:first-child { color:#edc894; white-space:nowrap; }
.queens-caption i { display:inline-block; width:5px; height:5px; background:#c1b788; margin-right:8px; border-radius:50%; }
.queens-stage { position:relative; }
.queens-stage svg { width:100%; height:auto; display:block; }
.queens-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px; background:#17202c; }
.queens-kicker { font:9px monospace; letter-spacing:1.7px; color:#e8bd87; }
.queens-footer p { font:12px monospace; color:#b7b6b5; margin:7px 0 0; }
.room-shortcuts { display:flex; gap:7px; }
.room-shortcuts button { padding:10px; border:1px solid #5f5960; color:#ddc8ad; border-radius:5px; font:11px monospace; min-height:44px; }
.room-shortcuts button:hover { background:#3d3440; }
.room-object { position:absolute; border:2px solid transparent; border-radius:10px; cursor:pointer; min-width:44px; min-height:44px; transition:box-shadow .25s,border-color .25s; }
.room-object:hover,.room-object:focus-visible { border-color:#e5c594; box-shadow:0 0 28px #f2bb632f; outline:none; background:#ffd58a0a; }
.room-object span { pointer-events:none; position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); white-space:nowrap; padding:8px 10px; font:11px monospace; color:#f4ddbc; background:#17202cf5; border:1px solid #796453; border-radius:4px; opacity:0; }
.room-object:hover span,.room-object:focus-visible span { opacity:1; }
.object-computer { left:30%; top:49%; width:14.5%; height:21%; }
.object-notebook { left:48%; top:66.5%; width:12%; height:8%; }
.object-board { left:83.5%; top:16%; width:11.5%; height:20%; }
.object-lamp { left:67.4%; top:47.5%; width:7%; height:8%; }
.desk-light { opacity:0; transition:opacity .8s; pointer-events:none; }
.lamp-on .desk-light { opacity:1; }
/* Independent SVG joints keep the character attached to his desk. */
.spider-head { transform-origin:23px 27px; animation:spider-breathe 4s ease-in-out infinite; }
.spider-working-arm { transform-origin:33px 35px; }
.spider-far-hand { transform-origin:0px 57px; }
.pose-repairing .spider-working-arm { animation:spider-repair 1.8s ease-in-out infinite; }
.pose-designing .spider-working-arm { animation:spider-sketch 2.4s ease-in-out infinite; }
.pose-typing .spider-working-arm { animation:spider-type .6s ease-in-out infinite; }
.pose-typing .spider-far-hand { animation:spider-type .6s ease-in-out -.3s infinite; }
.pose-idle .spider-head { animation-duration:6s; }
.pose-complete .spider-head { animation:spider-nod .7s ease-in-out 3; }
.pose-complete .spider-working-arm { animation:spider-cheer 1.1s ease-in-out 2; }
@keyframes spider-breathe { 50% { transform:translateY(.4px) rotate(-2deg); } }
@keyframes spider-repair { 35% { transform:rotate(2deg); } 70% { transform:rotate(-1deg); } }
@keyframes spider-sketch { 30% { transform:translateX(-1px) rotate(1deg); } 65% { transform:translateX(1px); } }
@keyframes spider-type { 50% { transform:translateY(-.8px); } }
.workshop-tool,.design-pencil { transform-origin:495px 439px; animation:workshop-adjust 1.8s steps(2,end) infinite; }
.design-pencil { animation:workshop-sketch 2.4s steps(3,end) infinite; }
.repair-kit,.workshop-tool,.monitor-shooter,.design-pencil { opacity:0; }
.workshop-repairing .repair-kit,.workshop-repairing .workshop-tool,.workshop-repairing .monitor-shooter,.workshop-designing .design-pencil { opacity:1; }
.workshop-repairing .suit-blueprint,.workshop-repairing .monitor-suit,.workshop-typing .suit-blueprint { opacity:0; }
.workshop-keyboard { opacity:0; }
.workshop-typing .workshop-keyboard { opacity:1; }
.monitor-scan { animation:workshop-scan 5s ease-in-out infinite; }
.workshop-complete .monitor-scan { stroke:#f6cb74; }
@keyframes workshop-adjust { 33% { transform:translateY(-4px) rotate(-8deg); } 66% { transform:rotate(7deg); } }
@keyframes workshop-sketch { 33% { transform:translate(-3px,-4px) rotate(8deg); } 66% { transform:translateX(3px) rotate(-5deg); } }
@keyframes workshop-scan { 50% { transform:translate(7px,47px); opacity:.12; } }
.queens-rain { animation:queens-rain 5s linear infinite; }
.queens-steam { animation:queens-steam 6s ease-in-out infinite; }
.queens-dust { animation:queens-dust 18s ease-in-out infinite alternate; }
.room-hidden * { animation-play-state:paused !important; }
.workspace-grid.spider-workspace { grid-template-columns:minmax(270px,310px) minmax(0,1fr); align-items:start; }
.spider-workspace .workspace-scene { align-self:start; }
.spider-workspace .scene-companion-note { padding:12px; }
.room-panel { border:1px solid #967351; border-radius:10px; width:min(550px,calc(100vw - 28px)); padding:18px; color:#e8d1af; background:#171a2a; max-height:85dvh; overflow:auto; }
.room-panel::backdrop { background:#080d20b8; backdrop-filter:blur(6px); }
.room-panel-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; font:14px monospace; }
.room-panel-heading button { border:1px solid #746153; padding:10px 14px; border-radius:5px; }
.room-panel textarea { min-height:250px; }
.room-soundscapes { padding:12px; border:1px solid #6c5b57; background:#222333; display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
.room-soundscapes select { background:#171a2a; padding:8px; border:1px solid #7e6c5b; color:#e8d1af; }
.room-soundscapes button { padding:10px; border:1px solid #a68965; color:#edc894; }
.room-soundscapes label { display:flex; gap:8px; align-items:center; }
.music-library-heading { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; color:#edc894; }
.music-library-heading button { padding:8px 14px; border:1px solid #7e6c5b; }
@keyframes queens-rain { to { transform:translate(-7px,22px); } }
@keyframes queens-steam { 50% { transform:translateY(-8px); opacity:.1; } }
@keyframes queens-dust { to { transform:translate(8px,-18px); opacity:.2; } }
@media(min-width:1600px) { .workspace-grid.spider-workspace { grid-template-columns:330px minmax(0,1fr); max-width:1720px; width:100%; margin:auto; } }
@media(max-width:1000px) { .workspace-grid.spider-workspace { grid-template-columns:minmax(230px,270px) minmax(0,1fr); gap:14px; } .queens-caption span:last-child { display:none; }.queens-footer { flex-wrap:wrap; padding:14px; } }
@media(max-width:760px) { .workspace-grid.spider-workspace { grid-template-columns:1fr; }.spider-workspace .workspace-scene { grid-row:1; }.queens-caption { padding:12px; }.queens-kicker { font-size:8px; letter-spacing:1px; }.room-shortcuts { width:100%; }.room-shortcuts button { flex:1; }.queens-footer p { font-size:11px; }.object-notebook { top:65%; }.object-lamp { top:46%; }.room-object span { font-size:9px; } }
@media(prefers-reduced-motion:reduce) { .spider-study-room * { animation:none !important; transition:none !important; } }

/* Workshop chrome: warm paper accents, deep ink, and generous hierarchy. */
.spider-study-room { border-color:#76604d80; border-radius:16px; background:#131c29; box-shadow:0 24px 70px #060b1870,0 1px 0 #f5d5aa12 inset; }
.queens-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:24px 26px 22px; background:linear-gradient(115deg,#202735,#17202c); border-bottom:1px solid #e9c39221; }
.queens-caption { padding:0; background:none; font-size:8px; letter-spacing:2px; justify-content:flex-start; gap:16px; }
.queens-caption span:last-child { color:#8e939b; }
.queens-caption i { background:#d9b783; box-shadow:0 0 9px #eec89355; }
.queens-heading h2 { margin:12px 0 8px; color:#f0e3d0; font-family:Georgia,serif; font-size:clamp(21px,2.2vw,31px); font-weight:400; line-height:1.2; letter-spacing:-.7px; }
.queens-heading h2 span { display:none; }
.queens-heading p { margin:0; color:#a7a7ac; font:11px/1.6 monospace; }
.queens-live { display:inline-flex; align-items:center; gap:7px; flex-shrink:0; border:1px solid #9eb8a339; padding:8px 10px; border-radius:20px; color:#b8d5bd; font:8px monospace; letter-spacing:1px; background:#86a98c09; }
.queens-stage { isolation:isolate; background:#252c3e; }
.queens-stage::after { content:''; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 -24px 40px #111c2933; border-bottom:1px solid #e6c79e21; }
.room-scene-label { position:absolute; z-index:1; left:18px; bottom:16px; display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid #b6c9cb25; border-radius:4px; background:#111d2bcc; color:#c4cfce; font:8px/1.4 monospace; letter-spacing:1px; backdrop-filter:blur(6px); pointer-events:none; }
.room-scene-label > span:not(.room-scene-dot) { color:#63777e; }
.room-scene-dot { width:4px; height:4px; border-radius:50%; background:#9ac8b2; box-shadow:0 0 8px #9ac8b255; }
.room-activity-bar { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 22px; border-bottom:1px solid #d5b48a17; background:#18212e; }
.room-activity-label { display:flex; align-items:center; gap:8px; font:8px monospace; letter-spacing:1.5px; color:#a0a9b3; }
.room-activity-label svg { color:#cfae7f; }
.room-activity-options { display:flex; gap:4px; }
.room-activity-options button { display:flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:8px 11px; border:1px solid transparent; border-radius:6px; color:#9ca7b5; font:10px monospace; transition:background .2s,color .2s,border-color .2s; }
.room-activity-options button[aria-pressed=true] { color:#f2d3a8; background:#d6b27c12; border-color:#c7a47850; }
.room-activity-options button:hover { color:#fff0d6; background:#d6b27c18; }
.room-activity-options button:disabled { opacity:.35; cursor:not-allowed; }
.room-activity-options button:focus-visible,.room-shortcuts button:focus-visible { outline:2px solid #f2d3a8; outline-offset:3px; }
.queens-footer { padding:22px; background:#141e2b; gap:20px; }
.queens-kicker { font-size:8px; color:#d5b58d; letter-spacing:1.6px; }
.queens-footer p { max-width:360px; font:11px/1.8 monospace; color:#9eabb9; }
.room-shortcuts { gap:6px; }
.room-shortcuts button { display:flex; align-items:center; justify-content:center; gap:7px; min-height:42px; border-color:#53617266; background:#202c3b60; color:#c1cad3; font-size:10px; transition:background .2s, border-color .2s; }
.room-shortcuts button:hover { background:#2c3948; border-color:#b49b79; }
.room-string-glow { animation:room-lights 6s ease-in-out infinite; }
.spider-lenses { animation:spider-eye-focus 9s ease-in-out infinite; transform-origin:23px 16px; }
.spider-celebration { opacity:0; }
.pose-complete .spider-celebration { animation:spider-sparkle 1.1s ease-out 2; }
.spider-working-arm,.spider-head { transition:transform .5s ease; }
@keyframes spider-eye-focus { 0%,42%,49%,100% { transform:scaleY(1); } 45%,46% { transform:scaleY(.86); } }
@keyframes spider-nod { 45% { transform:rotate(-6deg) translateY(.7px); } }
@keyframes spider-cheer { 30%,60% { transform:rotate(16deg); } }
@keyframes spider-sparkle { 15%,55% { opacity:1; } 100% { opacity:0; transform:translateY(-12px); } }
@keyframes room-lights { 50% { opacity:.55; } }
@media(min-width:1600px) { .queens-heading h2 span { display:inline; margin-left:20px; font:8px monospace; letter-spacing:1.5px; color:#818d9e; vertical-align:middle; } }
@media(max-width:1100px) { .queens-heading { padding:20px; }.queens-live { display:none; }.room-activity-bar { flex-wrap:wrap; padding:13px 16px; }.queens-footer { flex-wrap:wrap; }.room-shortcuts { width:100%; }.room-shortcuts button { flex:1; } }
@media(max-width:760px) { .queens-heading { padding:18px; }.queens-heading h2 { font-size:25px; }.queens-heading p { font-size:10px; }.queens-footer { padding:18px; }.room-activity-options { width:100%; }.room-activity-options button { flex:1; min-height:44px; padding:8px; }.room-scene-label { left:10px; bottom:10px; font-size:7px; letter-spacing:.5px; }.room-shortcuts button { min-height:44px; } }
@media(prefers-reduced-motion:reduce) { .spider-study-room * { animation:none !important; transition:none !important; }.pose-complete .spider-celebration { opacity:1; } }

/* The scene and its hit targets share the SVG's 1000:660 coordinate system. */
.queens-stage { aspect-ratio:1000/660; }
.queens-stage > svg { width:100%; height:100%; }
.queens-heading { padding:16px 20px; }
.queens-heading h2 { margin:8px 0 6px; }
.queens-footer { padding:14px 20px; }
.object-computer { border-color:#9cd7d733; }
@media(max-width:760px) {
  .room-object { min-width:24px; min-height:24px; border-radius:4px; }
  .object-notebook { top:66.5%; }
  .object-lamp { top:47.5%; }
  .room-shortcuts button { min-height:44px; }
}

/* Body and articulated arms share one room-space rig. */
.layer-hands { pointer-events:none; }
.spider-working-arm,.spider-far-hand { animation:none !important; }
.workshop-reading .suit-blueprint,.workshop-writing .suit-blueprint { opacity:0; }
.room-activity-options { flex-wrap:wrap; }
@media(prefers-reduced-motion:reduce) { .spider-study-room * { animation:none !important; } }
